global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files:
  - /etc/prometheus/alerts/*.yml

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "clickhouse"
    static_configs:
      - targets: ["clickhouse:9363"]
    metrics_path: /metrics
    scrape_interval: 30s

  - job_name: "kafka"
    static_configs:
      - targets: ["kafka:7071"]

  - job_name: "flink-jobmanager"
    static_configs:
      - targets: ["flink-jobmanager:9249"]
    metrics_path: /

  - job_name: "flink-taskmanager"
    static_configs:
      - targets: ["flink-taskmanager:9250"]
    metrics_path: /

  - job_name: "fastapi"
    static_configs:
      - targets: ["fastapi:8000"]
    metrics_path: /metrics

  - job_name: "mysql"
    static_configs:
      - targets: ["mysql-exporter:9104"]

  - job_name: "minio"
    static_configs:
      - targets: ["minio:9000"]
    metrics_path: /minio/v2/metrics/cluster
    scheme: http

  - job_name: "airflow"
    static_configs:
      - targets: ["airflow-webserver:8793"]
