# ==================== Prometheus ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: ecommerce-data-platform
  labels:
    app: prometheus
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
        tier: monitoring
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.48.0
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-lifecycle"
          ports:
            - containerPort: 9090
          volumeMounts:
            - name: prometheus-config
              mountPath: /etc/prometheus/prometheus.yml
              subPath: prometheus.yml
            - name: prometheus-alerts
              mountPath: /etc/prometheus/alerts
            - name: prometheus-data
              mountPath: /prometheus
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /-/healthy
              port: 9090
            initialDelaySeconds: 20
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /-/ready
              port: 9090
            initialDelaySeconds: 10
            periodSeconds: 5
      volumes:
        - name: prometheus-config
          configMap:
            name: prometheus-config
        - name: prometheus-alerts
          configMap:
            name: prometheus-alerts
        - name: prometheus-data
          persistentVolumeClaim:
            claimName: prometheus-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: ecommerce-data-platform
spec:
  selector:
    app: prometheus
  ports:
    - port: 9090
      targetPort: 9090
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prometheus-data-pvc
  namespace: ecommerce-data-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: ecommerce-data-platform
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      scrape_timeout: 10s
    alerting:
      alertmanagers:
        - static_configs:
            - targets: []
    rule_files:
      - /etc/prometheus/alerts/*.yml
    scrape_configs:
      - job_name: "prometheus"
        static_configs:
          - targets: ["localhost:9090"]
      - job_name: "clickhouse"
        static_configs:
          - targets: ["clickhouse:9363"]
        metrics_path: /metrics
        scrape_interval: 30s
      - job_name: "kafka"
        static_configs:
          - targets: ["kafka:7071"]
      - job_name: "flink-jobmanager"
        static_configs:
          - targets: ["flink-jobmanager:9249"]
        metrics_path: /
      - job_name: "flink-taskmanager"
        static_configs:
          - targets: ["flink-taskmanager:9250"]
        metrics_path: /
      - job_name: "fastapi"
        static_configs:
          - targets: ["fastapi:8000"]
        metrics_path: /metrics
      - job_name: "minio"
        static_configs:
          - targets: ["minio:9000"]
        metrics_path: /minio/v2/metrics/cluster
        scheme: http
      - job_name: "airflow"
        static_configs:
          - targets: ["airflow-webserver:8793"]
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: ecommerce-data-platform
data:
  ecommerce_alerts.yml: |
    groups:
      - name: ecommerce_alerts
        rules:
          - alert: ClickHouseDown
            expr: up{job="clickhouse"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "ClickHouse is down"
          - alert: KafkaDown
            expr: up{job="kafka"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Kafka is down"
          - alert: FlinkJobManagerDown
            expr: up{job="flink-jobmanager"} == 0
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Flink JobManager is down"
          - alert: FastAPIDown
            expr: up{job="fastapi"} == 0
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "FastAPI service is down"
---
# ==================== Grafana ====================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ecommerce-data-platform
  labels:
    app: grafana
    tier: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grafana
  template:
    metadata:
      labels:
        app: grafana
        tier: monitoring
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:10.2.0
          ports:
            - containerPort: 3000
          env:
            - name: GF_SECURITY_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: grafana-admin-user
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: platform-secrets
                  key: grafana-admin-password
            - name: GF_USERS_ALLOW_SIGN_UP
              value: "false"
          volumeMounts:
            - name: grafana-data
              mountPath: /var/lib/grafana
            - name: grafana-datasources
              mountPath: /etc/grafana/provisioning/datasources
            - name: grafana-dashboards-prov
              mountPath: /etc/grafana/provisioning/dashboards
            - name: grafana-dashboards
              mountPath: /var/lib/grafana/dashboards
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /api/health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 5
      volumes:
        - name: grafana-data
          persistentVolumeClaim:
            claimName: grafana-data-pvc
        - name: grafana-datasources
          configMap:
            name: grafana-datasources
        - name: grafana-dashboards-prov
          configMap:
            name: grafana-dashboards-provisioning
        - name: grafana-dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ecommerce-data-platform
spec:
  selector:
    app: grafana
  ports:
    - port: 3000
      targetPort: 3000
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: grafana-data-pvc
  namespace: ecommerce-data-platform
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ecommerce-data-platform
data:
  datasources.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
      - name: ClickHouse
        type: vertamedia-clickhouse-datasource
        access: proxy
        url: http://clickhouse:8123
        editable: true
        jsonData:
          defaultDatabase: ecommerce
          port: 8123
          username: default
        secureJsonData:
          password: clickhouse123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provisioning
  namespace: ecommerce-data-platform
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: "Ecommerce Dashboards"
        orgId: 1
        folder: "Ecommerce"
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards
          foldersFromFilesStructure: true
